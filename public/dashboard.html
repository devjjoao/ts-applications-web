<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Ts Applications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="icon" type="image/png" href="/img/ts-logo-filled.png" />
    <link rel="stylesheet" href="/css/shared.css" />
  </head>
  <body class="min-h-screen flex flex-col">
    <div class="bg-grid"></div>

    <nav
      class="w-full border-b border-zinc-800 bg-zinc-950/50 backdrop-blur-md sticky top-0 z-50"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center"
      >
        <div class="flex items-center gap-3">
          <img
            src="/img/ts-logo-transparent.png"
            alt="Ts Applications"
            class="brand-logo brand-logo--22"
          />
          <span class="font-bold text-lg tracking-tight"
            >Ts <span class="text-[#2563eb]">Applications</span></span
          >
        </div>

        <div class="hidden md:flex gap-8 text-sm font-medium text-zinc-400">
          <a href="/" class="hover:text-white transition">Início</a>
          <a href="/planos" class="hover:text-white transition">Planos</a>
          <a href="/sobre" class="hover:text-white transition">Sobre</a>
          <a
            href="/status"
            class="hover:text-white transition border-b-2 border-transparent"
            >Status</a
          >
        </div>

        <div class="relative auth-area">
          <button
            id="user-profile-btn"
            class="flex items-center gap-3 bg-zinc-900 border border-zinc-800 pr-4 pl-1 py-1 rounded-full hover:bg-zinc-800 transition"
          >
            <img
              id="user-avatar"
              src="https://cdn.discordapp.com/embed/avatars/0.png"
              class="w-8 h-8 rounded-full"
            />
            <span id="user-name" class="text-xs font-semibold text-white"
              >Visitante</span
            >
            <i class="fa-solid fa-chevron-down text-[10px] text-zinc-500"></i>
          </button>

          <div
            id="user-dropdown"
            class="dropdown-menu absolute right-0 mt-2 w-52 bg-[#09090b] border border-zinc-800 rounded-xl shadow-2xl p-1.5 z-50"
          >
            <a
              href="/dashboard"
              class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-zinc-300 hover:text-white hover:bg-zinc-900 rounded-lg transition"
              ><i class="fa-solid fa-layer-group w-4 text-zinc-500"></i> Minhas
              Aplicações</a
            >
            <a
              href="/conta"
              class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-zinc-300 hover:text-white hover:bg-zinc-900 rounded-lg transition"
              ><i class="fa-solid fa-user-gear w-4 text-zinc-500"></i> Minha
              Conta</a
            >
            <div class="h-px bg-zinc-800 my-1.5"></div>
            <button
              class="w-full flex items-center gap-3 px-3 py-2 text-xs font-medium text-red-400 hover:bg-red-500/10 rounded-lg text-left transition"
            >
              <i class="fa-solid fa-arrow-right-from-bracket w-4"></i> Sair
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto w-full p-8 md:p-12 flex-grow">
      <div class="mb-10">
        <h1 class="text-4xl font-extrabold tracking-tight uppercase">
          Suas <span class="text-[#2563eb]">Aplicações</span>
        </h1>
        <p class="text-zinc-500 text-sm mt-1">
          Gerencie suas instâncias e serviços contratados.
        </p>
      </div>

      <div
        id="empty-state"
        class="hidden min-h-[450px] flex flex-col items-center justify-center border border-dashed border-zinc-800 rounded-[2.5rem] bg-zinc-900/10 relative overflow-hidden"
      >
        <i class="fa-solid fa-box-open text-8xl opacity-[0.03] absolute"></i>
        <div class="relative z-10 flex flex-col items-center">
          <p class="text-zinc-500 mb-8 font-medium">
            Nenhum serviço ativo encontrado no momento.
          </p>
          <a
            href="/planos"
            class="btn-blue-cta text-white px-10 py-4 rounded-2xl font-bold text-sm flex items-center gap-3 uppercase tracking-tighter"
          >
            Ver Planos Disponíveis
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </a>
          <button
            id="create-demo"
            class="mt-4 text-blue-400 hover:text-blue-300 text-xs font-bold underline underline-offset-4"
          >
            Criar aplicação de demonstração
          </button>
        </div>
      </div>

      <div
        id="bots-grid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </main>

    <footer class="py-12 border-t border-zinc-900 bg-black text-center mt-auto">
      <p class="text-zinc-700 text-xs font-bold uppercase tracking-widest">
        © 2025 Ts Applications • Premium Infrastructure
      </p>
    </footer>

    <script src="/js/dashboard.js" defer></script>
    <script src="/js/site-guard.js" defer></script>
  </body>
</html>
