<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ts Applications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
  <link rel="stylesheet" href="/css/login.css">
    <link rel="icon" type="image/png" href="/img/ts-logo-filled.png">
  <link rel="stylesheet" href="/css/shared.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <canvas id="snowCanvas"></canvas>
    <div class="bg-grid"></div>
    <div class="aura"></div>

    <main class="w-full max-w-[450px] relative z-10">
        <div class="login-card p-8 md:p-12 text-center">
            <div class="flex justify-center mb-8">
                <div class="w-20 h-20 bg-blue-600/10 rounded-3xl flex items-center justify-center border border-blue-500/20 shadow-inner">
                    <img src="/img/ts-logo-transparent.png" alt="Ts Applications" class="brand-logo brand-logo--45">
                </div>
            </div>

            <h1 class="text-3xl font-black text-white mb-2">Bem-vindo!</h1>
            <p class="text-zinc-500 mb-10 text-sm">Acesse sua conta via Discord para gerenciar suas aplicações na <span class="text-blue-400 font-bold">Ts Applications</span>.</p>

            <a href="/api/auth/discord" class="discord-btn w-full flex items-center justify-center gap-3 text-white font-bold py-4 rounded-2xl mb-6">
                <i class="fa-brands fa-discord text-xl"></i>
                Entrar com Discord
            </a>

            <div class="flex items-center gap-4 mb-8">
                <div class="h-px bg-zinc-800 flex-grow"></div>
                <span class="text-[10px] text-zinc-600 uppercase font-black tracking-widest">Segurança Garantida</span>
                <div class="h-px bg-zinc-800 flex-grow"></div>
            </div>

            <a href="/" class="text-zinc-500 hover:text-white transition text-xs font-medium flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Voltar para a Home
            </a>
        </div>

        <p class="text-center mt-8 text-zinc-700 text-[10px] uppercase tracking-[3px]">
            © 2025 Ts Applications
        </p>
    </main>

    <script>
        // Revelar Site
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });

        // Efeito Neve
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let w, h, flakes = [];

        function initSnow() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
            flakes = [];
            for(let i=0; i<80; i++) flakes.push({x:Math.random()*w, y:Math.random()*h, r:Math.random()*2+1, d:Math.random()+0.3});
        }

        function drawSnow() {
            ctx.clearRect(0,0,w,h);
            ctx.fillStyle = "rgba(255,255,255,0.3)";
            ctx.beginPath();
            flakes.forEach(f => {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
                f.y += f.d; f.x += Math.sin(f.y/50)*0.5;
                if(f.y > h) f.y = -10;
            });
            ctx.fill();
            requestAnimationFrame(drawSnow);
        }

        initSnow();
        drawSnow();
        window.onresize = initSnow;
    </script>
    <script src="/js/site-guard.js"></script>
</body>
</html>
